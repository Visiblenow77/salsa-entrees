<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Salsa y Dulzura — Entrées</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1B0F1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entrées SyD">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;0,900;1,600&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B0F1A;
    --surface: #241522;
    --surface-2: #2E1B2B;
    --border: #40293C;
    --cream: #F3E9DC;
    --muted: #C7AFBE;
    --domingo: #D6A34D;
    --mambo: #E2143F;
    --cuba: #33ABA1;
    --twint: #D9447A;

    --good: #6FBF8B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%; overflow:hidden;}
  body{
    background: radial-gradient(ellipse at 20% -10%, #2A1728 0%, var(--bg) 55%);
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
    height: 100vh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .wrap{
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px 20px 16px;
  }
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap: 20px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .main-grid{
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    gap: 18px;
  }
  @media (max-width: 900px){
    html,body{ overflow: auto; height: auto; }
    .wrap{ height: auto; }
    .main-grid{ grid-template-columns: 1fr; }
  }
  .col{
    display:flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
  }
  .brand-logo{
    height: 56px;
    display:flex;
    align-items:center;
  }
  .brand-logo img{
    height: 100%;
    width: auto;
    display:block;
  }
  .subdate{
    color: var(--muted);
    font-size: 14px;
    margin-top: 4px;
  }
  .totalbox{
    background: linear-gradient(155deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px 20px;
    text-align: right;
    min-width: 220px;
    position: relative;
  }
  .totalbox .label{
    color: var(--muted);
    font-size: 12.5px;
    text-transform: none;
  }
  .totalbox .amount-row{
    display:flex; align-items:baseline; justify-content:flex-end; gap:10px;
  }
  .totalbox .amount{
    font-family:'Fraunces', serif;
    font-weight: 800;
    font-size: 32px;
    color: var(--good);
    line-height: 1.15;
  }
  .totalbox .amount.masked{
    letter-spacing: 2px;
  }
  .eye-btn{
    background: none;
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 32px; height: 32px;
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    color: var(--muted);
    flex-shrink: 0;
  }
  .eye-btn:hover{ border-color: var(--mambo); color: var(--cream); }
  .eye-btn svg{ width: 17px; height: 17px; }
  .totalbox .count{
    color: var(--cream);
    font-size: 13px;
    opacity: .8;
  }
  .header-actions{
    display:flex; align-items:center; gap: 10px;
  }
  .icon-btn{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--cream);
    font-family:'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    display:flex; align-items:center; gap:8px;
    height: fit-content;
  }
  .icon-btn:hover{ border-color: var(--domingo); }

  section.block{ display:flex; flex-direction:column; min-height:0; }
  .block.soirees-block{ flex-shrink: 0; }
  .block.payments-block{ flex: 1 1 auto; min-height: 0; }
  .block-title{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 16px;
    margin: 0 0 8px 2px;
    color: var(--cream);
    flex-shrink: 0;
  }

  .soirees{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .payments{
    flex: 1 1 auto;
    min-height: 0;
  }
  .soiree-tile{
    position: relative;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
    transition: transform .12s ease, border-color .15s ease, background .15s ease;
    color: var(--cream);
  }
  .soiree-tile:active{ transform: scale(0.98); }
  .soiree-tile .name{
    font-family:'Fraunces', serif;
    font-weight: 700;
    font-size: 19px;
    margin-bottom: 4px;
  }
  .soiree-tile .price{
    color: var(--muted);
    font-size: 14px;
  }
  .soiree-tile .dot{
    position:absolute; top:16px; right:16px;
    width:10px; height:10px; border-radius:50%;
    background: var(--dotcolor, #555);
    opacity: .5;
  }
  .soiree-tile[data-active="true"]{
    background: linear-gradient(155deg, var(--surface-2), var(--surface));
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent) inset, 0 8px 22px -12px var(--accent);
  }
  .soiree-tile[data-active="true"] .dot{ opacity: 1; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  .soiree-tile[data-active="true"] .name{ color: var(--accent); }

  .payments{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1fr;
    gap: 14px;
    height: 100%;
  }
  .pay-btn{
    background: var(--surface);
    border: 1.5px solid color-mix(in srgb, var(--accent, var(--border)) 40%, var(--border));
    border-radius: 18px;
    padding: 12px;
    text-align:center;
    cursor: pointer;
    color: var(--cream);
    transition: transform .1s ease, background .15s ease, border-color .15s ease;
    height: 100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .pay-btn:active{ transform: scale(0.96); }
  .pay-btn:not(:disabled):hover{ border-color: var(--accent, var(--border)); }
  .pay-btn .plabel{
    font-family:'Fraunces', serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--accent, var(--cream));
  }
  .pay-btn .pamount{
    margin-top: 6px;
    color: var(--muted);
    font-size: 13.5px;
  }
  .pay-btn:disabled{
    opacity: .35;
    cursor: not-allowed;
  }

  @media (max-width: 760px){
    .soirees{ grid-template-columns: 1fr; }
    .payments{ grid-template-columns: repeat(2, 1fr); }
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .card.grow{ flex: 1 1 auto; }
  .card.fixed{ flex-shrink: 0; }
  .breakdown-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14.5px;
  }
  .breakdown-row:last-child{ border-bottom: none; }
  .breakdown-row .r-count{ color: var(--muted); margin-left: 8px; font-size: 13px;}
  .breakdown-row .r-amount{ font-weight: 600; }

  .entrylist{
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }
  .entry-item{
    display:flex; justify-content:space-between; align-items:center;
    padding: 7px 0;
    font-size: 13.5px;
    color: var(--muted);
    border-bottom: 1px dashed var(--border);
  }
  .entry-item:last-child{ border-bottom:none; }
  .entry-item .e-method{ color: var(--cream); }
  .entry-item .e-amount{ font-variant-numeric: tabular-nums; }

  .actions-row{
    display:flex; gap: 10px; margin-top: 14px; flex-wrap: wrap;
  }
  .btn-secondary{
    flex:1;
    min-width: 140px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--cream);
    border-radius: 12px;
    padding: 12px 14px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-secondary:hover{ border-color: var(--mambo); }
  .btn-secondary.danger:hover{ border-color: #E4635A; color:#E4635A; }

  .empty-hint{
    color: var(--muted);
    font-size: 14px;
    padding: 8px 2px;
  }

  .history-list{ flex: 1 1 auto; min-height: 0; overflow-y:auto; }
  .history-item{
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .history-item:last-child{ border-bottom: none; }
  .history-item .h-top{
    display:flex; justify-content:space-between; font-size: 14px; margin-bottom: 3px;
  }
  .history-item .h-name{ font-weight: 700; }
  .history-item .h-sub{ color: var(--muted); font-size: 12.5px; }

  .modal-backdrop{
    position: fixed; inset:0; background: rgba(10,5,10,0.65);
    display:flex; align-items:center; justify-content:center;
    z-index: 50; padding: 20px;
  }
  .modal{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    max-width: 360px;
    text-align: center;
  }
  .modal p{ color: var(--cream); font-size: 15px; margin: 0 0 18px; }
  .modal .modal-actions{ display:flex; gap:10px; }
  .modal button{
    flex:1; padding: 11px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--cream); font-weight:600; cursor:pointer; font-family:'Work Sans',sans-serif;
  }
  .modal button.confirm{ background: var(--mambo); border-color: var(--mambo); color: #1B0F1A; }

  .toast{
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border:1px solid var(--border);
    padding: 10px 18px; border-radius: 12px; font-size: 14px;
    opacity: 0; pointer-events:none; transition: opacity .25s ease;
    z-index: 60;
  }
  .toast.show{ opacity: 1; }

  ::-webkit-scrollbar{ width: 7px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 10px; }

  .rotate-hint{
    display:none;
    position: fixed; inset:0; z-index: 90;
    background: var(--bg);
    color: var(--cream);
    align-items:center; justify-content:center;
    text-align:center; padding: 40px;
    font-family:'Fraunces', serif; font-size: 20px;
  }
  @media (orientation: portrait) and (max-width: 900px){
    .rotate-hint{ display:flex; }
  }

  .fond-overlay{
    position: fixed;
    inset: 0;
    background: rgba(10,5,10,0.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 55;
    padding: 20px;
  }
  .fond-overlay.open{ display: flex; }
  .fond-panel{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    max-width: 620px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .fond-panel-header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 8px;
  }
  .fond-panel-header .block-title{ margin:0; }
  .fond-close-btn{
    background: none; border: 1px solid var(--border); border-radius: 10px;
    color: var(--cream); width: 32px; height: 32px; cursor: pointer; font-size: 16px;
  }
  .soiree-edit-row{
    display:flex; align-items:center; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .soiree-edit-row:last-child{ border-bottom: none; }
  .soiree-edit-dot{
    width: 12px; height: 12px; border-radius: 50%;
    flex-shrink: 0;
  }
  .soiree-edit-row input{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--cream);
    padding: 9px 11px;
    font-size: 14px;
    font-family: 'Work Sans', sans-serif;
  }
  .soiree-edit-row .soiree-name-input{ flex: 1; min-width: 0; }
  .soiree-edit-row .soiree-price-wrap{
    display:flex; align-items:center; gap: 5px; flex-shrink: 0;
  }
  .soiree-edit-row .soiree-price-input{ width: 62px; text-align: right; }
  .soiree-edit-row .soiree-price-unit{ color: var(--muted); font-size: 13px; }

  .fond-groups{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
  }
  @media (max-width: 700px){ .fond-groups{ grid-template-columns: 1fr; } }
  .fond-group-title{
    color: var(--muted);
    font-size: 12.5px;
    margin-bottom: 8px;
  }
  .denom-row{
    display:flex; align-items:center; justify-content:space-between;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .denom-row:last-child{ border-bottom: none; }
  .denom-label{ font-size: 14.5px; min-width: 62px; }
  .denom-stepper{
    display:flex; align-items:center; gap: 8px;
  }
  .denom-stepper button{
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--cream);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
  }
  .denom-stepper button:hover{ border-color: var(--domingo); }
  .denom-stepper input{
    width: 42px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--cream);
    font-size: 14.5px;
    padding: 5px 2px;
    font-family: 'Work Sans', sans-serif;
  }
  .denom-line-total{
    min-width: 58px;
    text-align: right;
    font-size: 13.5px;
    color: var(--muted);
  }
  .fond-total-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .fond-total-row .flabel{ font-family:'Fraunces', serif; font-weight:600; font-size:16px; }
  .fond-total-row .fvalue{ font-family:'Fraunces', serif; font-weight:800; font-size:22px; color: var(--domingo); }
  .caisse-summary{
    margin-top: 10px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .caisse-summary strong{ color: var(--good); }
  /* ===== Stats ===== */
  :root{
    --sv-cash:   #199e70;
    --sv-carte:  #c98500;
    --sv-twint:  #d55181;
    --sv-invite: #9085e9;
    --sv-grid:   #3a2536;
    --sv-axis:   #55394f;
  }
  .stats-panel{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    max-width: 1080px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .sv-filters{
    display:flex; flex-wrap:wrap; gap: 16px;
    padding: 12px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .sv-fgroup{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sv-flabel{ color: var(--muted); font-size: 12px; margin-right:2px; }
  .sv-chip{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    font-family:'Work Sans',sans-serif;
    font-size: 12.5px; font-weight: 600;
    padding: 7px 13px;
    cursor: pointer;
  }
  .sv-chip[aria-pressed="true"]{
    background: var(--surface-2);
    border-color: var(--domingo);
    color: var(--cream);
  }
  .sv-tiles{
    display:grid; grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 12px; margin-bottom: 18px;
  }
  @media (max-width: 720px){ .sv-tiles{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
  .sv-tile{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .sv-tile .k{ color: var(--muted); font-size: 12px; }
  .sv-tile .v{
    font-family:'Fraunces',serif; font-weight: 800;
    font-size: 26px; line-height:1.2; color: var(--cream); margin-top: 2px;
  }
  .sv-tile .s{ color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .sv-section{ margin-bottom: 20px; }
  .sv-h{
    font-family:'Fraunces',serif; font-weight:600; font-size: 15px;
    color: var(--cream); margin: 0 0 2px;
  }
  .sv-sub{ color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .sv-chartbox{ position: relative; }
  .sv-chartbox svg{ display:block; width:100%; height:auto; }
  .sv-tip{
    position:absolute; pointer-events:none; opacity:0;
    transform: translate(-50%, -110%);
    background: #150b14; border: 1px solid var(--border);
    border-radius: 10px; padding: 7px 10px;
    font-size: 12px; color: var(--cream); white-space: nowrap;
    transition: opacity .12s ease; z-index: 3;
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
  }
  .sv-tip .t-d{ color: var(--muted); font-size: 11px; }
  .sv-mrow{ display:flex; flex-direction:column; gap: 9px; }
  .sv-m{ display:grid; grid-template-columns: 86px 1fr auto; align-items:center; gap: 10px; }
  .sv-m .m-l{ display:flex; align-items:center; gap:7px; color: var(--cream); font-size: 13px; font-weight:600; }
  .sv-swatch{ width: 10px; height: 10px; border-radius: 3px; flex-shrink:0; }
  .sv-track{ background: var(--surface); border-radius: 5px; height: 10px; overflow:hidden; }
  .sv-fill{ height: 100%; border-radius: 5px; }
  .sv-m .m-v{ color: var(--cream); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .sv-m .m-v span{ color: var(--muted); }
  .sv-table{ width: 100%; border-collapse: collapse; font-size: 13px; }
  .sv-table th{
    text-align: right; color: var(--muted); font-weight: 600; font-size: 11.5px;
    padding: 6px 8px; border-bottom: 1px solid var(--border);
  }
  .sv-table th:first-child, .sv-table td:first-child{ text-align: left; }
  .sv-table td{
    text-align: right; padding: 8px; border-bottom: 1px solid var(--border);
    color: var(--cream); font-variant-numeric: tabular-nums;
  }
  .sv-table tr:last-child td{ border-bottom: none; }
  .sv-table.detail th:nth-child(2), .sv-table.detail td:nth-child(2){ text-align: left; }
  .sv-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; }
  .sv-actions{ display:flex; gap:10px; flex-wrap: wrap; }
  .sv-scroll{ max-height: 260px; overflow-y: auto; }
  .sv-empty{
    color: var(--muted); font-size: 13px; text-align:center;
    padding: 30px 10px; border: 1px dashed var(--border); border-radius: 14px;
  }
</style>
</head>
<body>
<div class="rotate-hint">Tourne la tablette en mode paysage 📱↻</div>
<div class="wrap">
  <header>

        <div class="block-title">Journal de ce soir</div>
        <div class="entrylist" id="entryList"></div>
      </div>
      <div class="card grow">
        <div class="block-title">Historique</div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SOIREES = [
  {key:'domingo', name:'Domingo', price:10, accent:'#D6A34D'},
  {key:'mambo', name:'La Fiesta Mambo', price:18, accent:'#E4635A'},
  {key:'cuba', name:'La Sensual Cuba', price:18, accent:'#33ABA1'}
];

function loadSoireesConfig(){
  try{
    const raw = localStorage.getItem('syd-soirees');
    if(!raw) return;
    const saved = JSON.parse(raw);
    saved.forEach(s=>{
      const target = SOIREES.find(x=>x.key === s.key);
      if(target){
        if(typeof s.name === 'string' && s.name.trim()) target.name = s.name.trim();
        if(typeof s.price === 'number' && s.price >= 0) target.price = s.price;
      }
    });
  }catch(e){ /* garde les valeurs par défaut */ }
}

function saveSoireesConfig(){
  try{
    localStorage.setItem('syd-soirees', JSON.stringify(SOIREES.map(s=>({key:s.key, name:s.name, price:s.price}))));
  }catch(e){ showToast("Erreur de sauvegarde"); }
}

function renderSoireesPanel(){
  const panel = document.getElementById('soireesPanel');
  panel.innerHTML = `
    <div class="fond-panel-header">
      <div class="block-title">Soirées</div>
      <button class="fond-close-btn" id="soireesCloseBtn">✕</button>
    </div>
    <div class="empty-hint">Modifie le nom et le prix d'entrée de chaque soirée.</div>
    <div id="soireeEditRows" style="margin-top:8px;"></div>
    <div class="actions-row">
      <button class="btn-secondary" id="soireesSaveBtn">Enregistrer</button>
    </div>
  `;
  const rows = document.getElementById('soireeEditRows');
  rows.innerHTML = SOIREES.map(s=>`
    <div class="soiree-edit-row" data-key="${s.key}">
      <span class="soiree-edit-dot" style="background:${s.accent};"></span>
      <input type="text" class="soiree-name-input" value="${s.name}" maxlength="30">
      <div class="soiree-price-wrap">
        <input type="number" class="soiree-price-input" value="${s.price}" min="0" step="1" inputmode="numeric">
        <span class="soiree-price-unit">.-</span>
      </div>
    </div>
  `).join('');
  document.getElementById('soireesCloseBtn').addEventListener('click', ()=>{
    document.getElementById('soireesOverlay').classList.remove('open');
  });
  document.getElementById('soireesSaveBtn').addEventListener('click', ()=>{
    let ok = true;
    rows.querySelectorAll('.soiree-edit-row').forEach(row=>{
      const key = row.dataset.key;
      const nameVal = row.querySelector('.soiree-name-input').value.trim();
      const priceVal = parseFloat(row.querySelector('.soiree-price-input').value);
      if(!nameVal || isNaN(priceVal) || priceVal < 0){ ok = false; return; }
      const target = SOIREES.find(s=>s.key === key);
      target.name = nameVal;
      target.price = priceVal;
    });
    if(!ok){ showToast("Nom et prix doivent être valides"); return; }
    saveSoireesConfig();
    document.getElementById('soireesOverlay').classList.remove('open');
    renderAll();
    showToast("Soirées mises à jour");
  });
}

const METHODS = [
  {key:'cash', label:'Cash', color:'var(--domingo)'},
  {key:'carte', label:'Carte', color:'var(--cuba)'},
  {key:'twint', label:'TWINT', color:'var(--twint)'},
  {key:'invite', label:'Invité', free:true, color:'var(--mambo)'}
];

let currentSession = { soiree: null, entries: [], fond: {}, totalHidden: false };
let history = [];

const COINS = [0.05, 0.10, 0.20, 0.50, 1, 2, 5];
const NOTES = [10, 20, 50, 100, 200, 1000];

const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_CLOSED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 4.22-5.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-3.22 4.05M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';

function fmtCHF(n){ return n.toFixed(2).replace('.00','') + '.-'; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function todayLabel(){
  return new Date().toLocaleDateString('fr-CH', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
}

async function loadState(){
  try{
    const cur = localStorage.getItem('syd-current-session');
    if(cur){
      const parsed = JSON.parse(cur);
      if(parsed.date === todayISO()){
        currentSession = parsed;
        if(!currentSession.fond) currentSession.fond = {};
        if(typeof currentSession.totalHidden !== 'boolean') currentSession.totalHidden = false;
      }
    }
  }catch(e){ /* no existing session */ }
  try{
    const hist = localStorage.getItem('syd-history');
    if(hist) history = JSON.parse(hist);
  }catch(e){ history = []; }
}

async function saveSession(){
  currentSession.date = todayISO();
  try{
    localStorage.setItem('syd-current-session', JSON.stringify(currentSession));
  }catch(e){ showToast("Erreur de sauvegarde"); }
}

async function saveHistory(){
  try{
    localStorage.setItem('syd-history', JSON.stringify(history));
  }catch(e){ showToast("Erreur de sauvegarde"); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1600);
}

function renderSoirees(){
  const grid = document.getElementById('soireeGrid');
  grid.innerHTML = '';
  SOIREES.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'soiree-tile';
    el.style.setProperty('--accent', s.accent);
    el.style.setProperty('--dotcolor', s.accent);
    el.dataset.active = (currentSession.soiree === s.key) ? 'true' : 'false';
    el.innerHTML = `<div class="dot"></div><div class="name">${s.name}</div><div class="price">Entrée ${fmtCHF(s.price)}</div>`;
    el.addEventListener('click', ()=>{
      currentSession.soiree = s.key;
      saveSession();
      renderAll();
    });
    grid.appendChild(el);
  });
}

function currentSoireeObj(){
  return SOIREES.find(s=>s.key===currentSession.soiree) || null;
}

function renderPayments(){
  const grid = document.getElementById('paymentGrid');
  grid.innerHTML = '';
  const so = currentSoireeObj();
  METHODS.forEach(m=>{
    const btn = document.createElement('button');
    btn.className = 'pay-btn' + (m.free ? ' invite' : '');
    btn.style.setProperty('--accent', m.color);
    const amount = m.free ? 0 : (so ? so.price : 0);
    btn.disabled = !so;
    btn.innerHTML = `<div class="plabel">${m.label}</div><div class="pamount">${so ? fmtCHF(amount) : '—'}</div>`;
    btn.addEventListener('click', ()=> addEntry(m.key, amount));
    grid.appendChild(btn);
  });
}

function addEntry(method, amount){
  const so = currentSoireeObj();
  if(!so) return;
  currentSession.entries.push({
    method, amount, soiree: so.key, soireeName: so.name, ts: Date.now()
  });
  saveSession();
  renderAll();
}

function renderBreakdown(){
  const box = document.getElementById('breakdownBox');
  const totalEl = document.getElementById('totalAmount');
  totalEl.classList.toggle('masked', !!currentSession.totalHidden);
  const eyeBtn = document.getElementById('eyeBtn');
  eyeBtn.innerHTML = currentSession.totalHidden ? EYE_CLOSED : EYE_OPEN;

  if(currentSession.entries.length === 0){
    box.innerHTML = `<div class="empty-hint">Choisis une soirée, puis tape sur un mode de paiement pour compter les entrées.</div>`;
    totalEl.textContent = currentSession.totalHidden ? '•••••' : '0.-';
    document.getElementById('totalCount').textContent = '0 entrées';
    return;
  }
  let totalAmount = 0;
  const perMethod = {};
  METHODS.forEach(m=> perMethod[m.key] = {count:0, amount:0});
  currentSession.entries.forEach(e=>{
    totalAmount += e.amount;
    perMethod[e.method].count += 1;
    perMethod[e.method].amount += e.amount;
  });
  box.innerHTML = METHODS.map(m=>{
    const d = perMethod[m.key];
    return `<div class="breakdown-row">
      <span>${m.label}<span class="r-count">${d.count}×</span></span>
      <span class="r-amount">${currentSession.totalHidden ? '•••' : fmtCHF(d.amount)}</span>
    </div>`;
  }).join('');
  totalEl.textContent = currentSession.totalHidden ? '•••••' : fmtCHF(totalAmount);
  document.getElementById('totalCount').textContent = `${currentSession.entries.length} entrée${currentSession.entries.length>1?'s':''}`;

  renderCaisseSummary(perMethod.cash.amount);
}

function renderCaisseSummary(cashSalesAmount){
  const panel = document.getElementById('fondPanel');
  const existing = panel.querySelector('.caisse-summary');
  const fondTotal = computeFondTotal();
  const attendu = fondTotal + cashSalesAmount;
  const html = `<div class="caisse-summary">Fond de caisse <strong>${fmtCHF(fondTotal)}</strong> + ventes cash <strong>${fmtCHF(cashSalesAmount)}</strong> = caisse attendue <strong>${fmtCHF(attendu)}</strong></div>`;
  if(existing) existing.outerHTML = html;
}

function renderEntryList(){
  const list = document.getElementById('entryList');
  if(currentSession.entries.length === 0){
    list.innerHTML = `<div class="empty-hint">Aucune entrée pour l'instant.</div>`;
    return;
  }
  const methodLabel = k => (METHODS.find(m=>m.key===k)||{}).label || k;
  const rows = currentSession.entries.slice().reverse().map(e=>{
    const time = new Date(e.ts).toLocaleTimeString('fr-CH', {hour:'2-digit', minute:'2-digit'});
    return `<div class="entry-item">
      <span>${time} — ${e.soireeName} <span class="e-method">${methodLabel(e.method)}</span></span>
      <span class="e-amount">${fmtCHF(e.amount)}</span>
    </div>`;
  }).join('');
  list.innerHTML = rows;
}

function renderHistory(){
  const box = document.getElementById('historyList');
  if(history.length === 0){
    box.innerHTML = `<div class="empty-hint">Pas encore de soirée archivée.</div>`;
    return;
  }
  const rows = history.slice().reverse().map(h=>{
    const dateLabel = new Date(h.date).toLocaleDateString('fr-CH', {day:'2-digit', month:'2-digit', year:'numeric'});
    return `<div class="history-item">
      <div class="h-top"><span class="h-name">${h.soireeName || 'Soirée'}</span><span>${fmtCHF(h.totalAmount)}</span></div>
      <div class="h-sub">${dateLabel} · ${h.totalCount} entrée${h.totalCount>1?'s':''} · Cash ${fmtCHF(h.perMethod.cash.amount)} · Carte ${fmtCHF(h.perMethod.carte.amount)} · TWINT ${fmtCHF(h.perMethod.twint.amount)} · Invité ${h.perMethod.invite.count}×</div>
    </div>`;
  }).join('');
  box.innerHTML = rows;
}

function computeFondTotal(){
  let total = 0;
  Object.keys(currentSession.fond || {}).forEach(k=>{
    total += parseFloat(k) * (currentSession.fond[k] || 0);
  });
  return Math.round(total * 100) / 100;
}

function denomRow(value, isCoin){
  const qty = (currentSession.fond && currentSession.fond[value]) || 0;
  const lineTotal = Math.round(value * qty * 100) / 100;
  const displayLabel = isCoin
    ? (value < 1 ? `${Math.round(value*100)} cts` : `${value} CHF`)
    : `${value} CHF`;
  return `<div class="denom-row" data-value="${value}">
    <span class="denom-label">${displayLabel}</span>
    <div class="denom-stepper">
      <button class="dec" aria-label="Moins">−</button>
      <input type="number" min="0" inputmode="numeric" value="${qty}">
      <button class="inc" aria-label="Plus">+</button>
    </div>
    <span class="denom-line-total">${fmtCHF(lineTotal)}</span>
  </div>`;
}

function renderFondPanel(){
  const panel = document.getElementById('fondPanel');
  panel.innerHTML = `
    <div class="fond-panel-header">
      <div class="block-title">Fond de caisse</div>
      <button class="fond-close-btn" id="fondCloseBtn">✕</button>
    </div>
    <div class="fond-groups">
      <div>
        <div class="fond-group-title">Pièces</div>
        ${COINS.map(v=>denomRow(v, true)).join('')}
      </div>
      <div>
        <div class="fond-group-title">Billets</div>
        ${NOTES.map(v=>denomRow(v, false)).join('')}
      </div>
    </div>
    <div class="fond-total-row">
      <span class="flabel">Total fond de caisse</span>
      <span class="fvalue">${fmtCHF(computeFondTotal())}</span>
    </div>
    <div class="caisse-summary"></div>
  `;
  document.getElementById('fondCloseBtn').addEventListener('click', ()=>{
    document.getElementById('fondOverlay').classList.remove('open');
  });
  panel.querySelectorAll('.denom-row').forEach(row=>{
    const value = row.dataset.value;
    const input = row.querySelector('input');
    const update = (newQty)=>{
      newQty = Math.max(0, newQty);
      if(!currentSession.fond) currentSession.fond = {};
      currentSession.fond[value] = newQty;
      saveSession();
      renderFondPanel();
      renderBreakdown();
    };
    row.querySelector('.inc').addEventListener('click', ()=> update((parseInt(input.value)||0) + 1));
    row.querySelector('.dec').addEventListener('click', ()=> update((parseInt(input.value)||0) - 1));
    input.addEventListener('change', ()=> update(parseInt(input.value) || 0));
  });
  const cashAmount = currentSession.entries
    .filter(e=>e.method==='cash')
    .reduce((s,e)=>s+e.amount, 0);
  renderCaisseSummary(cashAmount);
}

function renderAll(){
  document.getElementById('dateLabel').textContent = todayLabel();
  renderSoirees();
  renderPayments();
  renderBreakdown();
  renderEntryList();
  renderHistory();
  renderFondPanel();
}

function showModal(message, onConfirm){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">
    <p>${message}</p>
    <div class="modal-actions">
      <button class="cancel">Annuler</button>
      <button class="confirm">Confirmer</button>
    </div>
  </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('.cancel').addEventListener('click', ()=> backdrop.remove());
  backdrop.querySelector('.confirm').addEventListener('click', ()=>{ backdrop.remove(); onConfirm(); });
}

document.getElementById('eyeBtn').addEventListener('click', ()=>{
  currentSession.totalHidden = !currentSession.totalHidden;
  saveSession();
  renderBreakdown();
});

document.getElementById('soireesToggleBtn').addEventListener('click', ()=>{
  document.getElementById('soireesOverlay').classList.add('open');
  renderSoireesPanel();
});
document.getElementById('soireesOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'soireesOverlay') e.currentTarget.classList.remove('open');
});

document.getElementById('fondToggleBtn').addEventListener('click', ()=>{
  document.getElementById('fondOverlay').classList.add('open');
});
document.getElementById('fondOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'fondOverlay') e.currentTarget.classList.remove('open');
});

document.getElementById('undoBtn').addEventListener('click', ()=>{
  if(currentSession.entries.length === 0) return;
  currentSession.entries.pop();
  saveSession();
  renderAll();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  showModal("Archiver la soirée en cours et repartir à zéro ?", async ()=>{
    if(currentSession.entries.length > 0){
      let totalAmount = 0;
      const perMethod = {};
      METHODS.forEach(m=> perMethod[m.key] = {count:0, amount:0});
      currentSession.entries.forEach(e=>{
        totalAmount += e.amount;
        perMethod[e.method].count += 1;
        perMethod[e.method].amount += e.amount;
      });
      const so = currentSoireeObj();
      history.push({
        date: currentSession.date || todayISO(),
        soiree: currentSession.soiree,
        soireeName: so ? so.name : '',
        totalAmount, totalCount: currentSession.entries.length, perMethod,
        fondTotal: computeFondTotal(),
        entries: currentSession.entries.map(e=>({m:e.method, a:e.amount, ts:e.ts}))
      });
      await saveHistory();
    }
    currentSession = { soiree: null, entries: [], date: todayISO(), fond: {}, totalHidden: false };
    await saveSession();
    renderAll();
    showToast("Nouvelle soirée prête");
  });
});

/* ===== Statistiques ===== */
const SV_COLORS = { cash:'#199e70', carte:'#c98500', twint:'#d55181', invite:'#9085e9' };
const SV_BAR = '#c98500';
let svRange = 90;      // jours ; 0 = tout
let svSoiree = 'all';

function svEsc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function svDate(d){
  return new Date(d).toLocaleDateString('fr-CH', {day:'2-digit', month:'2-digit', year:'2-digit'});
}
function svShortDate(d){
  return new Date(d).toLocaleDateString('fr-CH', {day:'2-digit', month:'2-digit'});
}
function svNum(n){
  return Math.round(n).toLocaleString('fr-CH');
}

function svFiltered(){
  let rows = history.slice().filter(h => h && h.perMethod);
  if(svRange > 0){
    const limit = Date.now() - svRange * 864e5;
    rows = rows.filter(h => new Date(h.date).getTime() >= limit);
  }
  if(svSoiree !== 'all') rows = rows.filter(h => h.soiree === svSoiree);
  rows.sort((a,b) => new Date(a.date) - new Date(b.date));
  return rows;
}

function svMethod(h, key){
  const m = h.perMethod && h.perMethod[key];
  return { count: (m && m.count) || 0, amount: (m && m.amount) || 0 };
}

/* --- Barres verticales : entrées par soirée dans le temps --- */
function svBarChart(rows){
  if(rows.length === 0) return '<div class="sv-empty">Aucune soirée sur cette période.</div>';

  const W = 800, H = 260, padL = 42, padT = 16, padB = 34;
  const padR = rows.length > 1 ? 74 : 12;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const max = Math.max(...rows.map(r => r.totalCount), 1);
  const niceMax = Math.ceil(max / 5) * 5 || 5;
  const y = v => padT + plotH - (v / niceMax) * plotH;
  const slot = plotW / rows.length;
  const bw = Math.max(3, Math.min(46, slot - 2));   // 2px de respiration entre barres
  const avg = rows.reduce((s, r) => s + r.totalCount, 0) / rows.length;

  const ticks = [0, niceMax/2, niceMax].map(v =>
    `<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W-padR}" y2="${y(v).toFixed(1)}" stroke="var(--sv-grid)" stroke-width="1"/>
     <text x="${padL-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" fill="#C7AFBE" font-size="11">${Math.round(v)}</text>`
  ).join('');

  const step = Math.ceil(rows.length / 8);
  const bars = rows.map((r, i) => {
    const x = padL + i * slot + (slot - bw) / 2;
    const h = Math.max(2, plotH - (y(r.totalCount) - padT));
    const label = (i % step === 0 || i === rows.length - 1)
      ? `<text x="${(x + bw/2).toFixed(1)}" y="${H - 12}" text-anchor="middle" fill="#C7AFBE" font-size="10.5">${svShortDate(r.date)}</text>` : '';
    return `<rect class="sv-bar" x="${x.toFixed(1)}" y="${y(r.totalCount).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
        rx="4" fill="${SV_BAR}"
        data-i="${i}" data-cx="${(x + bw/2).toFixed(1)}" data-cy="${y(r.totalCount).toFixed(1)}"
        tabindex="0" role="img"
        aria-label="${svEsc(r.soireeName || 'Soirée')} du ${svDate(r.date)} : ${r.totalCount} entrées, ${fmtCHF(r.totalAmount)}"></rect>${label}`;
  }).join('');

  const avgLine = rows.length > 1
    ? `<line x1="${padL}" y1="${y(avg).toFixed(1)}" x2="${W-padR+4}" y2="${y(avg).toFixed(1)}" stroke="#C7AFBE" stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/>
       <text x="${W-padR+8}" y="${(y(avg)-2).toFixed(1)}" text-anchor="start" fill="#C7AFBE" font-size="10.5">moyenne</text>
       <text x="${W-padR+8}" y="${(y(avg)+11).toFixed(1)}" text-anchor="start" fill="#F3E9DC" font-size="12" font-weight="600">${avg.toFixed(1)}</text>` : '';

  return `<div class="sv-chartbox" id="svChartBox">
    <svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Entrées par soirée">
      ${ticks}${avgLine}${bars}
      <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--sv-axis)" stroke-width="1"/>
    </svg>
    <div class="sv-tip" id="svTip"></div>
  </div>`;
}

/* --- Barres horizontales : répartition des paiements --- */
function svMethodBars(rows){
  const tot = {};
  METHODS.forEach(m => tot[m.key] = { count:0, amount:0 });
  rows.forEach(h => METHODS.forEach(m => {
    const d = svMethod(h, m.key);
    tot[m.key].count += d.count;
    tot[m.key].amount += d.amount;
  }));
  const totalCount = METHODS.reduce((s,m) => s + tot[m.key].count, 0);
  if(totalCount === 0) return '<div class="sv-empty">Aucune entrée sur cette période.</div>';
  const maxCount = Math.max(...METHODS.map(m => tot[m.key].count), 1);

  return '<div class="sv-mrow">' + METHODS.map(m => {
    const d = tot[m.key];
    const pct = (d.count / totalCount) * 100;
    const c = SV_COLORS[m.key];
    return `<div class="sv-m">
      <div class="m-l"><span class="sv-swatch" style="background:${c}"></span>${svEsc(m.label)}</div>
      <div class="sv-track"><div class="sv-fill" style="width:${(d.count/maxCount*100).toFixed(1)}%;background:${c}"></div></div>
      <div class="m-v">${svNum(d.count)} <span>(${pct.toFixed(0)}%)</span> · ${fmtCHF(d.amount)}</div>
    </div>`;
  }).join('') + '</div>';
}

/* --- Tableau : comparaison par type de soirée --- */
function svSoireeTable(rows){
  const keys = [...new Set(rows.map(h => h.soiree))];
  if(keys.length === 0) return '';
  const stats = keys.map(k => {
    const rs = rows.filter(h => h.soiree === k);
    const count = rs.reduce((s,h) => s + h.totalCount, 0);
    const amount = rs.reduce((s,h) => s + h.totalAmount, 0);
    const so = SOIREES.find(s => s.key === k);
    return {
      key: k,
      name: (rs[rs.length-1] && rs[rs.length-1].soireeName) || (so && so.name) || 'Soirée',
      accent: (so && so.accent) || '#C7AFBE',
      nights: rs.length, count, amount,
      avg: count / rs.length
    };
  }).sort((a,b) => b.amount - a.amount);

  return `<table class="sv-table">
    <thead><tr><th>Soirée</th><th>Soirées</th><th>Entrées</th><th>Moy./soirée</th><th>Encaissé</th></tr></thead>
    <tbody>${stats.map(s => `<tr>
      <td><span class="sv-dot" style="background:${s.accent}"></span>${svEsc(s.name)}</td>
      <td>${s.nights}</td><td>${svNum(s.count)}</td>
      <td>${s.avg.toFixed(1)}</td><td>${fmtCHF(s.amount)}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

/* --- Tableau détaillé (vue données) --- */
function svDetailTable(rows){
  if(rows.length === 0) return '';
  return `<div class="sv-scroll"><table class="sv-table detail">
    <thead><tr><th>Date</th><th>Soirée</th><th>Entrées</th><th>Cash</th><th>Carte</th><th>TWINT</th><th>Invités</th><th>Total</th></tr></thead>
    <tbody>${rows.slice().reverse().map(h => `<tr>
      <td>${svDate(h.date)}</td><td>${svEsc(h.soireeName || '—')}</td>
      <td>${h.totalCount}</td>
      <td>${svMethod(h,'cash').count}</td>
      <td>${svMethod(h,'carte').count}</td>
      <td>${svMethod(h,'twint').count}</td>
      <td>${svMethod(h,'invite').count}</td>
      <td>${fmtCHF(h.totalAmount)}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
}

function svExportCSV(){
  const rows = svFiltered();
  if(rows.length === 0){ showToast("Rien à exporter"); return; }
  const head = ['Date','Soiree','Entrees','Cash (nb)','Cash (CHF)','Carte (nb)','Carte (CHF)','TWINT (nb)','TWINT (CHF)','Invites (nb)','Total (CHF)'];
  const lines = rows.map(h => [
    h.date, (h.soireeName||''), h.totalCount,
    svMethod(h,'cash').count, svMethod(h,'cash').amount,
    svMethod(h,'carte').count, svMethod(h,'carte').amount,
    svMethod(h,'twint').count, svMethod(h,'twint').amount,
    svMethod(h,'invite').count, h.totalAmount
  ]);
  const csv = '﻿' + [head, ...lines].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url;
  a.download = `syd-soirees-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  showToast("Export CSV créé");
}

function renderStatsPanel(){
  const panel = document.getElementById('statsPanel');
  const rows = svFiltered();
  const nights = rows.length;
  const entries = rows.reduce((s,h) => s + h.totalCount, 0);
  const amount = rows.reduce((s,h) => s + h.totalAmount, 0);
  const paying = rows.reduce((s,h) => s + (h.totalCount - svMethod(h,'invite').count), 0);
  const best = rows.slice().sort((a,b) => b.totalCount - a.totalCount)[0];

  const ranges = [[30,'30 jours'],[90,'3 mois'],[365,'12 mois'],[0,'Tout']];
  const soireeChips = [['all','Toutes'], ...SOIREES.map(s => [s.key, s.name])];

  panel.innerHTML = `
    <div class="fond-panel-header">
      <div class="block-title">📊 Statistiques des soirées</div>
      <button class="fond-close-btn" id="statsCloseBtn" aria-label="Fermer">✕</button>
    </div>

    <div class="sv-filters">
      <div class="sv-fgroup"><span class="sv-flabel">Période</span>
        ${ranges.map(([v,l]) => `<button class="sv-chip" data-range="${v}" aria-pressed="${svRange===v}">${l}</button>`).join('')}
      </div>
      <div class="sv-fgroup"><span class="sv-flabel">Soirée</span>
        ${soireeChips.map(([k,l]) => `<button class="sv-chip" data-soiree="${svEsc(k)}" aria-pressed="${svSoiree===k}">${svEsc(l)}</button>`).join('')}
      </div>
    </div>

    ${nights === 0 ? `<div class="sv-empty">Pas encore de soirée archivée sur cette sélection.<br>Les statistiques se remplissent quand tu clôtures une soirée avec « Nouvelle soirée ».</div>` : `
    <div class="sv-tiles">
      <div class="sv-tile"><div class="k">Soirées</div><div class="v">${nights}</div><div class="s">archivées</div></div>
      <div class="sv-tile"><div class="k">Entrées</div><div class="v">${svNum(entries)}</div><div class="s">dont ${svNum(entries - paying)} invités</div></div>
      <div class="sv-tile"><div class="k">Encaissé</div><div class="v">${fmtCHF(amount)}</div><div class="s">${paying ? fmtCHF(amount/paying) + ' / entrée payante' : '—'}</div></div>
      <div class="sv-tile"><div class="k">Moyenne</div><div class="v">${(entries/nights).toFixed(1)}</div><div class="s">entrées par soirée</div></div>
    </div>

    <div class="sv-section">
      <h3 class="sv-h">Entrées par soirée</h3>
      <div class="sv-sub">Chronologique${best ? ` · record : ${svEsc(best.soireeName||'soirée')} du ${svDate(best.date)}, ${best.totalCount} entrées` : ''}</div>
      ${svBarChart(rows)}
    </div>

    <div class="sv-section">
      <h3 class="sv-h">Répartition des paiements</h3>
      <div class="sv-sub">Nombre d'entrées, part du total et montant encaissé</div>
      ${svMethodBars(rows)}
    </div>

    <div class="sv-section">
      <h3 class="sv-h">Par type de soirée</h3>
      <div class="sv-sub">Sur la période sélectionnée</div>
      ${svSoireeTable(rows)}
    </div>

    <div class="sv-section">
      <h3 class="sv-h">Détail des soirées</h3>
      <div class="sv-sub">De la plus récente à la plus ancienne</div>
      ${svDetailTable(rows)}
    </div>

    <div class="sv-actions">
      <button class="btn-secondary" id="svExportBtn">⬇︎ Exporter en CSV</button>
    </div>`}
  `;

  panel.querySelectorAll('[data-range]').forEach(b => b.addEventListener('click', () => {
    svRange = parseInt(b.dataset.range, 10); renderStatsPanel();
  }));
  panel.querySelectorAll('[data-soiree]').forEach(b => b.addEventListener('click', () => {
    svSoiree = b.dataset.soiree; renderStatsPanel();
  }));
  const closeBtn = document.getElementById('statsCloseBtn');
  if(closeBtn) closeBtn.addEventListener('click', () => document.getElementById('statsOverlay').classList.remove('open'));
  const exp = document.getElementById('svExportBtn');
  if(exp) exp.addEventListener('click', svExportCSV);

  // Infobulle (souris + tactile + clavier)
  const box = document.getElementById('svChartBox');
  const tip = document.getElementById('svTip');
  if(box && tip){
    const show = el => {
      const r = rows[parseInt(el.dataset.i, 10)];
      if(!r) return;
      const invites = svMethod(r,'invite').count;
      tip.innerHTML = `<div>${svEsc(r.soireeName || 'Soirée')} — <strong>${r.totalCount}</strong> entrées</div>
        <div class="t-d">${svDate(r.date)} · ${fmtCHF(r.totalAmount)}${invites ? ` · ${invites} invité${invites>1?'s':''}` : ''}</div>`;
      const svg = box.querySelector('svg');
      const scale = svg.getBoundingClientRect().width / 800;
      tip.style.left = (parseFloat(el.dataset.cx) * scale) + 'px';
      tip.style.top  = (parseFloat(el.dataset.cy) * scale) + 'px';
      tip.style.opacity = 1;
    };
    const hide = () => { tip.style.opacity = 0; };
    box.querySelectorAll('.sv-bar').forEach(el => {
      el.addEventListener('mouseenter', () => show(el));
      el.addEventListener('focus', () => show(el));
      el.addEventListener('mouseleave', hide);
      el.addEventListener('blur', hide);
      el.addEventListener('touchstart', e => { show(el); }, {passive:true});
    });
    box.addEventListener('touchend', () => setTimeout(hide, 2200), {passive:true});
  }
}

document.getElementById('statsToggleBtn').addEventListener('click', () => {
  renderStatsPanel();
  document.getElementById('statsOverlay').classList.add('open');
});
document.getElementById('statsOverlay').addEventListener('click', e => {
  if(e.target.id === 'statsOverlay') e.currentTarget.classList.remove('open');
});

(async function init(){
  loadSoireesConfig();
  await loadState();
  renderAll();
})();
</script>
