<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Salsa y Dulzura — Suivi en direct</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#1B0F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suivi SyD">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B0F1A; --surface:#241522; --surface-2:#2E1B2B; --border:#40293C;
    --cream:#F3E9DC; --muted:#C7AFBE;
    --cash:#199e70; --carte:#c98500; --twint:#d55181; --invite:#9085e9;
    --good:#6FBF8B; --warn:#D6A34D; --bad:#E2143F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--cream);
    font-family:'Work Sans',system-ui,sans-serif;
    padding:18px 16px calc(24px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto;}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px;}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:22px;margin:0;letter-spacing:-.3px;}
  .soiree{color:var(--muted);font-size:14px;margin-bottom:18px;}
  .status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0;}
  .dot.live{background:var(--good);}
  .dot.stale{background:var(--warn);}
  .dot.off{background:var(--bad);}
  .hero{
    background:var(--surface);border:1px solid var(--border);border-radius:18px;
    padding:20px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;
  }
  .hero .k{color:var(--muted);font-size:12.5px;}
  .hero .v{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:34px;line-height:1.15;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px 18px;margin-bottom:14px;}
  .card h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:15px;margin:0 0 12px;}
  .m{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:10px;margin-bottom:10px;}
  .m:last-child{margin-bottom:0;}
  .m .l{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;}
  .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .track{background:var(--surface-2);border-radius:5px;height:10px;overflow:hidden;}
  .fill{height:100%;border-radius:5px;transition:width .4s ease;}
  .m .v{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .m .v span{color:var(--muted);}
  .note{color:var(--muted);font-size:12.5px;line-height:1.5;}
  .big-msg{
    background:var(--surface);border:1px dashed var(--border);border-radius:18px;
    padding:34px 22px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6;
  }
  footer{color:var(--muted);font-size:11.5px;text-align:center;margin-top:20px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="big-msg">Chargement…</div>
</div>

<script>
const DB = 'https://salsa-entrees-live-default-rtdb.europe-west1.firebasedatabase.app';
const COLORS = { cash:'var(--cash)', carte:'var(--carte)', twint:'var(--twint)', invite:'var(--invite)' };
const key = (location.hash || '').replace('#','').trim();
const app = document.getElementById('app');

function chf(n){ return (Math.round(n*100)/100).toFixed(2).replace('.00','') + '.-'; }
function ago(ts){
  const s = Math.max(0, Math.round((Date.now() - ts)/1000));
  if(s < 45)   return "à l'instant";
  if(s < 90)   return "il y a 1 min";
  if(s < 3600) return "il y a " + Math.round(s/60) + " min";
  const h = Math.floor(s/3600);
  return "il y a " + h + (h > 1 ? " heures" : " heure");
}

function msg(txt){ app.innerHTML = '<div class="big-msg">' + txt + '</div>'; }

if(!key || key.length < 24){
  msg("Lien incomplet.<br>Ouvre le lien exact copié depuis l'application de la tablette, sans rien enlever après le <b>#</b>.");
  throw new Error('no key');
}

let last = null, failures = 0;

function render(d){
  if(!d){
    msg("Aucune soirée en cours.<br><br>Dès que l'employé ouvrira une soirée sur la tablette, les entrées apparaîtront ici.");
    return;
  }
  const age = Date.now() - (d.t || 0);
  const cls = failures > 2 ? 'off' : age > 180000 ? 'stale' : 'live';
  const lbl = failures > 2 ? 'hors ligne' : age > 180000 ? 'en attente' : 'en direct';
  const labels = {};
  (d.labels || []).forEach(x => labels[x.k] = x.l);
  const per = d.per || {};
  // on garde l'ordre des modes de paiement de l'app, pas l'ordre alphabetique
  const order = (d.labels || []).map(x => x.k).filter(k => per[k]);
  Object.keys(per).forEach(k => { if(order.indexOf(k) === -1) order.push(k); });
  const maxC = Math.max(1, ...order.map(k => per[k].c || 0));
  const rows = order.filter(k => (per[k].c || 0) > 0).map(k => `
    <div class="m">
      <div class="l"><span class="sw" style="background:${COLORS[k] || 'var(--muted)'}"></span>${labels[k] || k}</div>
      <div class="track"><div class="fill" style="width:${Math.round((per[k].c/maxC)*100)}%;background:${COLORS[k] || 'var(--muted)'}"></div></div>
      <div class="v">${per[k].c} <span>· ${chf(per[k].a)}</span></div>
    </div>`).join('');

  app.innerHTML = `
    <header>
      <h1>Entrées</h1>
      <div class="status"><span class="dot ${cls}"></span>${lbl}</div>
    </header>
    <div class="soiree">${d.soiree ? d.soiree : 'Aucune soirée choisie'}${d.t ? ' · mis à jour ' + ago(d.t) : ''}</div>

    <div class="hero">
      <div><div class="k">Entrées</div><div class="v">${d.count || 0}</div></div>
      <div><div class="k">Encaissé</div><div class="v">${chf(d.amount || 0)}</div></div>
    </div>

    <div class="card">
      <h2>Répartition des paiements</h2>
      ${rows || '<div class="note">Aucune entrée pour le moment.</div>'}
    </div>

    ${ d.fond ? `<div class="card"><h2>Fond de caisse</h2><div class="note">Compté à l'ouverture : <b style="color:var(--cream)">${chf(d.fond)}</b></div></div>` : '' }

    <footer>Lecture seule · les chiffres se rafraîchissent tout seuls<br>Salsa y Dulzura</footer>
  `;
}

async function tick(){
  try{
    const r = await fetch(DB + '/live/' + key + '.json?_=' + Date.now(), { cache:'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    failures = 0;
    last = d;
    render(d);
  }catch(e){
    failures++;
    if(last) render(last);
    else if(failures > 2) msg("Impossible de joindre le suivi.<br>Vérifie ta connexion, la page réessaie toute seule.");
  }
}

tick();
setInterval(tick, 4000);
setInterval(()=>{ if(last) render(last); }, 30000);   // rafraichit le "il y a X min"
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) tick(); });
</script>
</body>
</html>
